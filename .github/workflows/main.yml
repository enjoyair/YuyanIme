name: 自动编译 Android APK (纯净剔除版)

on:
  workflow_dispatch:

jobs:
  build:
    name: 编译 APK
    runs-on: ubuntu-latest

    steps:
      # 1. 检出源代码 (包含子模块)
      - name: 检出源代码
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      # 2. 配置 Java 运行环境
      - name: 设置 JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # 3. 设置 Gradle 8.7
      - name: 设置 Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7' 

      # 4. 【核心手术 A】：物理删除所有搜狗语音、手写等第三方闭源 .so 库
      - name: 物理销毁闭源二进制库
        run: |
          find . -name "libSogouShell.so" -type f -delete
          find . -name "libgpen_handwriter.so" -type f -delete
          find . -name "libhandwriting.so" -type f -delete
          find . -name "libhwInterface.so" -type f -delete
          echo "✅ 闭源第三方库已彻底删除"

      # 5. 【核心手术 B】：强制注释 Java 代码中的加载指令，防止软件闪退
      - name: 切断 Java 层的加载指令
        run: |
          find . -name "*.java" -o -name "*.kt" -exec sed -i 's/System.loadLibrary("SogouShell")/\/\/ System.loadLibrary("SogouShell")/g' {} +
          find . -name "*.java" -o -name "*.kt" -exec sed -i 's/System.loadLibrary("handwriting")/\/\/ System.loadLibrary("handwriting")/g' {} +
          find . -name "*.java" -o -name "*.kt" -exec sed -i 's/System.loadLibrary("hwInterface")/\/\/ System.loadLibrary("hwInterface")/g' {} +
          find . -name "*.java" -o -name "*.kt" -exec sed -i 's/System.loadLibrary("gpen_handwriter")/\/\/ System.loadLibrary("gpen_handwriter")/g' {} +
          echo "✅ Java 加载链路已切断"

      # 6. 绕过私有签名限制 (使用默认测试签名)
      - name: 绕过私有签名限制
        run: |
          find . -name "build.gradle" -exec sed -i 's/signingConfigs.release/signingConfigs.debug/g' {} +

      # 7. 执行编译 (依然使用离线配置，双重保险)
      - name: 编译离线 Debug APK
        run: gradle assembleOfflineDebug

      # 8. 上传最终的纯净 APK
      - name: 上传 APK 文件
        uses: actions/upload-artifact@v4
        with:
          name: app-pure-clean-apk
          path: '**/*.apk'
