name: 自动编译 Android APK (外科手术容错版)

on:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: 编译极客纯净版 APK
    runs-on: ubuntu-latest

    steps:
      - name: 检出源代码
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'
          fetch-depth: 1

      - name: 设置 JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: 赋予 Gradle Wrapper 执行权限
        run: chmod +x ./gradlew

      # 【核心手术 A】：物理销毁闭源二进制库
      - name: 物理销毁闭源二进制库
        run: |
          find . -name "libSogouShell.so" -type f -delete || true
          find . -name "libgpen_handwriter.so" -type f -delete || true
          find . -name "libhandwriting.so" -type f -delete || true
          find . -name "libhwInterface.so" -type f -delete || true
          echo "✅ 闭源第三方库销毁完毕"

      # 【核心手术 B】：切断代码加载链路
      - name: 切断代码加载链路
        run: |
          find . -type f \( -name "*.java" -o -name "*.kt" \) -exec sed -i 's/System.loadLibrary("SogouShell")/\/\/ System.loadLibrary("SogouShell")/g' {} + || true
          find . -type f \( -name "*.java" -o -name "*.kt" \) -exec sed -i 's/System.loadLibrary("handwriting")/\/\/ System.loadLibrary("handwriting")/g' {} + || true
          find . -type f \( -name "*.java" -o -name "*.kt" \) -exec sed -i 's/System.loadLibrary("hwInterface")/\/\/ System.loadLibrary("hwInterface")/g' {} + || true
          find . -type f \( -name "*.java" -o -name "*.kt" \) -exec sed -i 's/System.loadLibrary("gpen_handwriter")/\/\/ System.loadLibrary("gpen_handwriter")/g' {} + || true
          echo "✅ Java/Kotlin 加载指令阻断完毕"

      # 【核心手术 C】：精准剥离导致崩溃的私有签名读取逻辑 (解决 path=null 报错)
      - name: 剥离私有签名配置变量
        run: |
          sed -i '/storeFile/d' app/build.gradle || true
          sed -i '/storePassword/d' app/build.gradle || true
          sed -i '/keyAlias/d' app/build.gradle || true
          sed -i '/keyPassword/d' app/build.gradle || true
          # 依然保留对配置类型的替换作为双重保险
          find . -type f \( -name "build.gradle" -o -name "build.gradle.kts" \) -exec sed -i 's/signingConfigs\.release/signingConfigs\.debug/g' {} + || true
          echo "✅ 私有签名变量已彻底切除，规避 Gradle null 报错"

      # 执行编译
      - name: 编译离线 Debug APK
        run: ./gradlew assembleOfflineDebug --stacktrace

      # 提取并上传产物
      - name: 上传最终的纯净 APK 文件
        uses: actions/upload-artifact@v4
        with:
          name: YuyanIme-Surgical-Pure-APK
          path: app/build/outputs/apk/offline/debug/*.apk
          retention-days: 7
