name: 自动编译 Android APK (外科手术级纯净版)

on:
  workflow_dispatch:

jobs:
  build:
    name: 编译极客纯净版 APK
    runs-on: ubuntu-latest

    steps:
      # 1. 检出源代码 (包含子模块，浅克隆加速)
      - name: 检出源代码
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'
          fetch-depth: 1

      # 2. 配置 Java 运行环境并开启 Gradle 缓存
      - name: 设置 JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      # 3. 赋予 Gradle Wrapper 执行权限 (自适应未来版本)
      - name: 赋予 Gradle Wrapper 执行权限
        run: chmod +x ./gradlew

      # 4. 【核心手术 A】：物理销毁第三方闭源二进制库 (.so)
      - name: 物理销毁闭源二进制库
        run: |
          find . -name "libSogouShell.so" -type f -delete
          find . -name "libgpen_handwriter.so" -type f -delete
          find . -name "libhandwriting.so" -type f -delete
          find . -name "libhwInterface.so" -type f -delete
          echo "✅ 闭源第三方库已彻底物理删除"

      # 5. 【核心手术 B】：切断 Java/Kotlin 层的加载指令，防止闪退
      # 优化说明：修复了 find 命令多条件组合时的语法，确保同时搜索 .java 和 .kt 文件不出错
      - name: 切断代码加载链路
        run: |
          find . -type f \( -name "*.java" -o -name "*.kt" \) -exec sed -i 's/System.loadLibrary("SogouShell")/\/\/ System.loadLibrary("SogouShell")/g' {} +
          find . -type f \( -name "*.java" -o -name "*.kt" \) -exec sed -i 's/System.loadLibrary("handwriting")/\/\/ System.loadLibrary("handwriting")/g' {} +
          find . -type f \( -name "*.java" -o -name "*.kt" \) -exec sed -i 's/System.loadLibrary("hwInterface")/\/\/ System.loadLibrary("hwInterface")/g' {} +
          find . -type f \( -name "*.java" -o -name "*.kt" \) -exec sed -i 's/System.loadLibrary("gpen_handwriter")/\/\/ System.loadLibrary("gpen_handwriter")/g' {} +
          echo "✅ Java/Kotlin 代码中的加载指令已全部安全注释"

      # 6. 【鲁棒性优化】兼容不同 Gradle 脚本的签名绕过
      - name: 绕过私有签名限制 (自适应匹配)
        run: |
          find . -type f \( -name "build.gradle" -o -name "build.gradle.kts" \) -exec sed -i 's/signingConfigs\.release/signingConfigs\.debug/g' {} +

      # 7. 使用本地 Wrapper 执行编译 (仅编译 Offline 版本，彻底剥离网络相关配置)
      - name: 编译离线 Debug APK
        run: ./gradlew assembleOfflineDebug --stacktrace

      # 8. 精准提取并上传纯净 APK 产物
      - name: 上传最终的纯净 APK 文件
        uses: actions/upload-artifact@v4
        with:
          name: YuyanIme-Surgical-Pure-APK
          path: app/build/outputs/apk/offline/debug/*.apk
          retention-days: 7
