name: 自动编译 Android APK

on:
  workflow_dispatch:

jobs:
  build:
    name: 编译 APK
    runs-on: ubuntu-latest

    steps:
      # 1. 检出源代码 (包含子模块)
      - name: 检出源代码
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      # 2. 配置 Java 运行环境
      - name: 设置 JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # 3. 安装官方 Gradle 8.7 工具
      - name: 设置 Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7' 

      # 4. 【新增步骤】：绕过原开发者的私有签名，强制使用默认测试签名
      - name: 绕过私有签名限制
        run: |
          find . -name "build.gradle" -exec sed -i 's/signingConfigs.release/signingConfigs.debug/g' {} +

      # 5. 执行编译命令
      - name: 编译离线 Debug APK
        run: gradle assembleOfflineDebug

      # 6. 上传 APK 文件
      - name: 上传 APK 文件
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: '**/*.apk'
