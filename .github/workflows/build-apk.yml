name: 自动编译 Android APK

# 触发条件：你可以手动点击按钮触发编译
on:
  workflow_dispatch:

jobs:
  build:
    name: 编译 APK
    runs-on: ubuntu-latest # 使用 GitHub 官方提供的最新 Ubuntu 系统作为编译环境

    steps:
      # 1. 下载源代码 (注意：增加了 with 和 submodules 两行)
      - name: 检出源代码
        uses: actions/checkout@v4
        with:
          submodules: 'recursive' # 关键指令：递归下载所有子模块(yuyansdk等)

      # 2. 配置 Java 环境
      - name: 设置 JDK 17
        uses: actions/setup-java@v4

      # 3. 安装官方 Gradle 工具 (这是新加的一步，用来代替缺失的 gradlew)
      - name: 设置 Gradle
        uses: gradle/actions/setup-gradle@v3

      # 4. 执行编译命令 (不再使用 ./gradlew，直接使用 gradle)
      - name: 编译 Debug APK
        run: gradle assembleOfflineDebug

      # 5. 上传 APK
      - name: 上传 APK 文件
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: '**/*.apk'
