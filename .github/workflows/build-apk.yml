name: 自动编译 Android APK

# 触发条件：你可以手动点击按钮触发编译
on:
  workflow_dispatch:

jobs:
  build:
    name: 编译 APK
    runs-on: ubuntu-latest # 使用 GitHub 官方提供的最新 Ubuntu 系统作为编译环境

    steps:
      # 1. 下载源代码到编译服务器
      - name: 检出源代码
        uses: actions/checkout@v4

      # 2. 配置 Java 运行环境 (Android 编译必备)
      - name: 设置 JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17' # 目前大多数新版 Android 项目都需要 Java 17，如果编译失败可尝试改为 '11'
          distribution: 'temurin'
          cache: gradle # 开启缓存，加快后续编译速度

      # 3. 赋予 Gradle 编译脚本执行权限
      - name: 赋予 gradlew 执行权限
        run: chmod +x gradlew

      # 4. 执行编译命令 (构建 Debug 版本的 APK)
      - name: 编译 Debug APK
        run: ./gradlew assembleDebug

      # 5. 将编译好的 APK 上传，供你下载
      - name: 上传 APK 文件
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk # 你下载时的压缩包名字
          # 自动寻找编译输出目录下的所有 .apk 文件
          path: '**/*.apk'
