name: 自动编译 Android APK

on:
  workflow_dispatch:

jobs:
  build:
    name: 编译 APK
    runs-on: ubuntu-latest

    steps:
      # 1. 检出源代码 (保留了子模块下载)
      - name: 检出源代码
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      # 2. 配置 Java 运行环境
      - name: 设置 JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # 3. 安装官方 Gradle 工具 (修改了这里：锁定了 8.7 版本，解决水土不服)
      - name: 设置 Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7' 

      # 4. 执行编译命令
      - name: 编译离线 Debug APK
        run: gradle assembleOfflineDebug

      # 5. 上传 APK 文件
      - name: 上传 APK 文件
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: '**/*.apk'
